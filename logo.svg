<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1B20"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- cajon body -->
  <rect x="150" y="84" width="212" height="300" rx="26" fill="url(#wood)"/>
  <rect x="150" y="84" width="212" height="300" rx="26" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="4"/>
  <!-- tapa (playing plate) line -->
  <path d="M178 118h156" stroke="#0B0B0D" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
  <!-- sound hole -->
  <circle cx="256" cy="250" r="56" fill="#0B0B0D"/>
  <circle cx="256" cy="250" r="56" fill="none" stroke="#0B0B0D" stroke-opacity=".25" stroke-width="14" transform="translate(0 2)"/>
  <!-- beat dots: Bass / Slap / ghost -->
  <circle cx="200" cy="436" r="17" fill="#FACC15"/>
  <circle cx="256" cy="436" r="17" fill="#22C55E"/>
  <circle cx="312" cy="436" r="11" fill="#FB923C"/>
</svg>
